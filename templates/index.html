<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Translator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'app-bg': '#0f172a', /* dark slate */
                        'app-panel': '#0b0f19', /* darker blue-black */
                        'brand-teal': '#34d399', /* emerald/teal */
                        'brand-teal-light': '#a7f3d0',
                        'brand-red': '#ef4444',
                        'brand-yellow': '#fbbf24',
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-app-bg text-white min-h-screen flex flex-col items-center justify-center font-inter p-4 md:p-8">

    <div class="w-full max-w-6xl mx-auto">
        <!-- Title -->
        <h1 class="text-4xl md:text-5xl font-bold text-center text-white mb-8">Sign Language Translator</h1>
        
        <!-- Main Application Box -->
        <div class="bg-app-panel rounded-3xl p-6 md:p-8 shadow-2xl flex flex-col lg:flex-row gap-8 w-full border border-gray-800">
            
            <!-- Left Column: Camera -->
            <div class="flex-grow w-full lg:w-2/3 h-[500px] lg:h-[600px] rounded-2xl overflow-hidden relative border border-gray-800 bg-gray-900 shadow-inner">
                <img src="{{ url_for('video_feed') }}" alt="Camera Feed" class="absolute inset-0 w-full h-full object-cover">
                <!-- Status Overlay (optional, just in case feed breaks) -->
                <div id="camera-loading" class="absolute inset-0 flex items-center justify-center bg-gray-900 z-[-1]">
                    <span class="text-gray-500 font-medium">Loading Camera...</span>
                </div>
            </div>

            <!-- Right Column: UI Panel -->
            <div class="w-full lg:w-1/3 flex flex-col gap-6">
                
                <!-- Currently Seeing Box -->
                <div class="border-2 border-brand-teal rounded-2xl p-6 flex flex-col items-center justify-center min-h-[160px] bg-[#0d1624] transition-all duration-300" id="currently-seeing-box">
                    <h2 class="text-sm uppercase tracking-widest text-white font-bold mb-4">Currently Seeing</h2>
                    <div class="text-7xl font-bold text-brand-teal" id="current-letter">-</div>
                </div>

                <!-- Built Word Box -->
                <div class="border border-gray-700 rounded-2xl p-6 flex flex-col bg-[#0b0f19] min-h-[140px]">
                    <h2 class="text-sm uppercase tracking-widest text-white font-bold mb-4">Built Word</h2>
                    <div class="text-4xl font-bold text-white break-all flex-grow flex items-center" id="current-sentence">-</div>
                </div>

                <!-- Controls -->
                <div class="flex flex-col gap-4 mt-auto">
                    <!-- Add Letter Button -->
                    <button onclick="triggerAction('add')" class="w-full bg-brand-teal hover:bg-emerald-300 text-gray-900 font-bold text-xl py-5 rounded-2xl transition-transform active:scale-95 flex items-center justify-center gap-2 shadow-lg">
                        <i class="fa-solid fa-plus"></i> Add Letter (Space)
                    </button>
                    
                    <!-- Bottom Two Buttons -->
                    <div class="flex gap-4">
                        <button onclick="triggerAction('delete')" class="flex-1 bg-brand-red hover:bg-red-400 text-white font-bold text-lg py-4 rounded-2xl transition-transform active:scale-95 shadow-lg">
                            Backspace
                        </button>
                        <button onclick="triggerAction('speak')" class="flex-1 bg-brand-yellow hover:bg-yellow-300 text-gray-900 font-bold text-lg py-4 rounded-2xl transition-transform active:scale-95 shadow-lg">
                            Speak & Clear
                        </button>
                    </div>
                </div>

                <!-- Status Text -->
                <div class="text-center mt-2">
                    <p class="text-gray-400 font-medium" id="status-text">System Ready. Show a sign!</p>
                </div>

            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
