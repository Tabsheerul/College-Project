<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sign Language Reader</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col font-inter bg-gradient-to-br from-gray-900 to-black">

    <!-- Header -->
    <header class="py-6 px-8 flex items-center justify-between glass-header z-10 relative shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/50">
                <i class="fa-solid fa-hands-asl-interpreting text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">SignAI Word Builder</h1>
        </div>
        <div class="flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 border border-white/10 text-sm font-medium text-emerald-400">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
            </span>
            LSTM Model Active
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col md:flex-row gap-6 p-6 max-w-7xl mx-auto w-full">
        
        <!-- Camera Feed Section -->
        <div class="flex-grow relative rounded-3xl overflow-hidden glass-panel border border-white/10 shadow-2xl flex flex-col h-full min-h-[500px]">
            <img src="{{ url_for('video_feed') }}" alt="Camera Feed" class="absolute inset-0 w-full h-full object-cover z-0">
            
            <!-- Overlay for live prediction -->
            <div class="absolute top-6 left-6 z-10">
                <div class="glass-pill px-5 py-3 rounded-2xl flex items-center gap-4 transition-all duration-300" id="prediction-badge">
                    <div class="flex flex-col">
                        <span class="text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">Detecting Sign</span>
                        <div class="flex items-end gap-3">
                            <span id="current-letter" class="text-5xl font-bold text-white leading-none">-</span>
                            <span id="confidence" class="text-emerald-400 font-medium mb-1 text-lg">0%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Controls Hints overlay -->
            <div class="absolute top-6 right-6 z-10 flex flex-col gap-2">
                <div class="glass-pill px-4 py-2 rounded-xl text-xs font-medium text-gray-300 flex items-center gap-2">
                    <kbd class="bg-gray-800 border border-gray-600 rounded px-2 py-1 text-white">Space</kbd> Add Letter
                </div>
                <div class="glass-pill px-4 py-2 rounded-xl text-xs font-medium text-gray-300 flex items-center gap-2">
                    <kbd class="bg-gray-800 border border-gray-600 rounded px-2 py-1 text-white">Bksp</kbd> Delete Letter
                </div>
                <div class="glass-pill px-4 py-2 rounded-xl text-xs font-medium text-gray-300 flex items-center gap-2">
                    <kbd class="bg-gray-800 border border-gray-600 rounded px-2 py-1 text-white">Enter</kbd> Speak Word
                </div>
            </div>
        </div>

        <!-- Sidebar / Output Section -->
        <div class="w-full md:w-96 flex flex-col gap-6">
            
            <!-- Output Builder Panel -->
            <div class="glass-panel p-6 rounded-3xl border border-white/10 shadow-xl flex-grow flex flex-col">
                <div class="flex items-center gap-2 mb-6">
                    <i class="fa-solid fa-comment-dots text-blue-400"></i>
                    <h2 class="text-lg font-semibold text-gray-200">Current Word</h2>
                </div>
                
                <div class="flex-grow bg-gray-900/50 rounded-2xl border border-gray-800 p-6 flex flex-col justify-center items-center min-h-[200px] shadow-inner relative overflow-hidden">
                    <!-- Typing indicator effect -->
                    <div class="absolute inset-0 bg-gradient-to-b from-blue-500/5 to-transparent pointer-events-none"></div>
                    
                    <p id="current-sentence" class="text-4xl md:text-5xl font-bold text-center text-white break-all tracking-wide"></p>
                    
                    <p id="placeholder-text" class="text-gray-600 text-center font-medium absolute">Start signing to build a word...</p>
                </div>

                <!-- Manual UI Controls (Alternative to keyboard) -->
                <div class="grid grid-cols-2 gap-3 mt-6">
                    <button onclick="triggerAction('delete')" class="btn-secondary py-3 px-4 rounded-xl font-medium flex items-center justify-center gap-2 transition-all">
                        <i class="fa-solid fa-delete-left"></i> Delete
                    </button>
                    <button onclick="triggerAction('add')" class="btn-primary py-3 px-4 rounded-xl font-medium flex items-center justify-center gap-2 transition-all">
                        <i class="fa-solid fa-plus"></i> Add Letter
                    </button>
                    <button onclick="triggerAction('speak')" class="col-span-2 btn-speak py-4 px-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 mt-2 transition-all shadow-lg shadow-blue-500/25">
                        <i class="fa-solid fa-volume-high"></i> Speak Word
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
