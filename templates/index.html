<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Translator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'app-bg': '#0f172a', /* dark slate */
                        'app-panel': '#0b0f19', /* darker blue-black */
                        'brand-teal': '#34d399', /* emerald/teal */
                        'brand-teal-light': '#a7f3d0',
                        'brand-red': '#ef4444',
                        'brand-yellow': '#fbbf24',
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-app-bg text-white h-screen w-screen overflow-hidden flex flex-col items-center justify-center font-inter p-4 md:p-6">

    <div class="w-full h-full max-w-6xl mx-auto flex flex-col">
        <!-- Title -->
        <h1 class="text-3xl md:text-4xl font-bold text-center text-white mb-6 flex-shrink-0 tracking-wide">Sign Language Translator</h1>
        
        <!-- Main Application Box -->
        <div class="bg-app-panel rounded-3xl p-5 md:p-6 shadow-2xl flex flex-col lg:flex-row gap-6 w-full flex-grow border border-gray-800 overflow-hidden min-h-0">
            
            <!-- Left Column: Camera -->
            <div class="flex-grow w-full lg:w-[65%] rounded-2xl overflow-hidden relative border border-gray-800 bg-gray-900 shadow-inner h-full min-h-0">
                <img src="{{ url_for('video_feed') }}" alt="Camera Feed" class="absolute inset-0 w-full h-full object-cover">
                <!-- Status Overlay (optional, just in case feed breaks) -->
                <div id="camera-loading" class="absolute inset-0 flex items-center justify-center bg-gray-900 z-[-1]">
                    <span class="text-gray-500 font-medium">Loading Camera...</span>
                </div>
            </div>

            <!-- Right Column: UI Panel -->
            <div class="w-full lg:w-[35%] flex flex-col gap-4 h-full min-h-0">
                
                <!-- Currently Seeing Box -->
                <div class="border-[3px] border-brand-teal rounded-2xl p-4 flex flex-col items-center justify-center flex-[1.2] bg-[#0d1624] transition-all duration-300 shadow-lg min-h-0" id="currently-seeing-box">
                    <h2 class="text-xs lg:text-sm uppercase tracking-[0.2em] text-white font-bold mb-2 opacity-90">Currently Seeing</h2>
                    <div class="text-7xl lg:text-8xl font-black text-brand-teal leading-none" id="current-letter">-</div>
                </div>

                <!-- Built Word Box -->
                <div class="border border-gray-700 rounded-2xl p-5 flex flex-col flex-1 bg-[#0b0f19] shadow-lg min-h-0">
                    <h2 class="text-xs lg:text-sm uppercase tracking-[0.2em] text-white font-bold mb-2 opacity-90">Built Word</h2>
                    <div class="text-4xl font-bold text-white break-all flex-grow flex items-center" id="current-sentence">-</div>
                </div>

                <!-- Controls -->
                <div class="flex flex-col gap-3 flex-shrink-0 mt-2">
                    <!-- Add Letter Button -->
                    <button onclick="triggerAction('add')" class="w-full bg-brand-teal hover:bg-emerald-300 text-gray-900 font-bold text-lg lg:text-xl py-4 rounded-xl transition-transform active:scale-95 flex items-center justify-center gap-2 shadow-md">
                        <i class="fa-solid fa-plus"></i> Add Letter (Space)
                    </button>
                    
                    <!-- Bottom Two Buttons -->
                    <div class="flex gap-3">
                        <button onclick="triggerAction('delete')" class="flex-1 bg-brand-red hover:bg-red-400 text-white font-bold text-base lg:text-lg py-3 rounded-xl transition-transform active:scale-95 shadow-md">
                            Backspace
                        </button>
                        <button onclick="triggerAction('speak')" class="flex-1 bg-brand-yellow hover:bg-yellow-300 text-gray-900 font-bold text-base lg:text-lg py-3 rounded-xl transition-transform active:scale-95 shadow-md">
                            Clear
                        </button>
                    </div>
                </div>

                <!-- Status Text -->
                <div class="text-center mt-1 flex-shrink-0">
                    <p class="text-gray-400 font-medium text-sm lg:text-base" id="status-text">System Ready. Show a sign!</p>
                </div>

            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
