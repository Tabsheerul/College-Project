{% extends "base.html" %}
{% block content %}
<div class="w-full h-full flex items-center justify-center p-4">
    <div class="bg-app-panel border border-gray-800 p-8 rounded-3xl shadow-2xl w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-white mb-6">Create Account</h2>
        
        <form method="POST" action="{{ url_for('signup') }}" class="flex flex-col gap-4">
            <div>
                <label class="block text-gray-400 text-sm font-bold mb-2">Username</label>
                <input type="text" name="username" required class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-brand-teal focus:ring-1 focus:ring-brand-teal transition-colors">
            </div>
            
            <div>
                <label class="block text-gray-400 text-sm font-bold mb-2">Password</label>
                <input type="password" name="password" required class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-brand-teal focus:ring-1 focus:ring-brand-teal transition-colors">
            </div>
            
            <button type="submit" class="w-full bg-brand-teal hover:bg-emerald-400 text-gray-900 font-bold text-lg py-3 rounded-xl mt-4 transition-transform active:scale-95 shadow-lg">
                Sign Up
            </button>
        </form>
        
        <p class="text-center text-gray-400 mt-6">
            Already have an account? <a href="{{ url_for('login') }}" class="text-brand-teal hover:underline font-semibold">Login</a>
        </p>
    </div>
</div>
{% endblock %}
